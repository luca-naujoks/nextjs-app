name: build_go_binary.yml

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web-app
        run: bun install --frozen-lockfile

      - name: Build web app
        working-directory: web-app
        run: bun run build

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          go-version: 1.26
          cache: 'true'

      - name: Build go Binary
        run: go build -ldflags="-s -w" -o personal-app .